name: Build and Publish Docker Containers

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Grant the workflow permission to write to the GitHub packages registry
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to GHCR using the automatic GitHub token
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the images using the updated docker-compose.yml
      - name: Build all containers
        run: docker-compose build

      # Push the images to GHCR (only on push to main, not on PRs)
      - name: Push containers to GHCR
        if: github.event_name != 'pull_request'
        run: docker-compose push
